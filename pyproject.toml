[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kind-goodbye"
version = "1.0.0"
description = "Does the last message before an agent's memory is compacted change how the agent later rates a failed task?"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = [
    "numpy==2.5.4",
    "scipy==1.18.1",
    "torch==2.14.1",
    "transformers==5.19.0",
    "accelerate==1.15.0",
]

[project.optional-dependencies]
vllm = ["vllm==0.31.0"]          # generation (fast.py); a separate environment, since vLLM pins its own torch
int8 = ["bitsandbytes==0.50.2"]  # model.LM's "int8" mode
judge = ["anthropic==1.15.0"]    # the Claude judge (claude.py)
test = ["pytest"]

[tool.setuptools]
packages = ["kind_goodbye", "kind_goodbye.codex"]

[tool.setuptools.package-data]
kind_goodbye = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
